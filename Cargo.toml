[package]
name = "dotkei"
version = "0.1.0"
edition = "2024"
authors = ["AnonymousDapper"]
license = "MIT"
description = "Project dotkei toolchain interface"

[dependencies]
ast = { path = "components/ast" }
clap = { version = "4.6.1", "features" = ["derive"] }
cst = { path = "components/cst" }
lexer = { path = "components/lexer" }
logging = { path = "components/logging" }
macros = { path = "components/macros" }
parser = { path = "components/parser" }
session = { path = "components/session" }
storage = { path = "components/storage" }
symbol = { path = "components/symbol" }
unicode-normalization = "0.1.25"
